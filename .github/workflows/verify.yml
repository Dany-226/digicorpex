name: Verify site
on:
  pull_request:
  push:
    branches: [main, refonte-2026]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:static
      - run: npm run test:export
